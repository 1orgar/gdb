name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag name (e.g. v0.4.1)'
        required: true
        default: 'v0.4.1'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Stage 1: Run comprehensive test suite before building or publishing ANY assets
  test:
    name: Run Test Suite (Pre-Release Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Run All Workspace Tests
        run: cargo test --workspace --all-targets --verbose

  # Stage 2: Build release binaries across platforms ONLY if tests pass
  build-assets:
    name: Build ${{ matrix.asset_name }} (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. macOS Apple Silicon (ARM64)
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-arm64
            use_cross_action: false

          # 2. macOS Intel (x86_64)
          - os: macos
            arch: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            asset_name: macos-x86_64
            use_cross_action: false

          # 3. Linux (x86_64)
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
            use_cross_action: false

          # 4. Linux (ARM64)
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: linux-arm64
            use_cross_action: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Building assets for release tag: ${TAG}"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Linux Cross Toolchain
        if: matrix.use_cross_action
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux' && !matrix.use_cross_action
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config

      - name: Build Release Binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin gdb-server \
            --bin gdb-cli \
            --bin gdb-studio

      - name: Package Release Assets
        shell: bash
        run: |
          DIST_DIR="gdb-${{ env.RELEASE_TAG }}-${{ matrix.asset_name }}"
          mkdir -p "${DIST_DIR}"
          
          # Copy binaries
          cp "target/${{ matrix.target }}/release/gdb-server" "${DIST_DIR}/"
          cp "target/${{ matrix.target }}/release/gdb-cli" "${DIST_DIR}/"
          cp "target/${{ matrix.target }}/release/gdb-studio" "${DIST_DIR}/"
          
          # Copy documentation, license and example assets
          cp README.md "${DIST_DIR}/"
          cp LICENSE "${DIST_DIR}/"
          cp docs/SERVER_AND_QUERY_GUIDE.md "${DIST_DIR}/"
          cp -r examples "${DIST_DIR}/"
          cp -r scripts "${DIST_DIR}/"
          
          # Create archive
          ARCHIVE_NAME="${DIST_DIR}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" "${DIST_DIR}"
          
          # Generate SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          
          mkdir -p dist_upload
          mv "${ARCHIVE_NAME}" dist_upload/
          mv "${ARCHIVE_NAME}.sha256" dist_upload/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.asset_name }}
          path: dist_upload/*
          retention-days: 2

  # Stage 3: Publish GitHub Release ONCE with all artifacts, clean changelog, and Dutch codename
  publish-release:
    name: Publish GitHub Release & Assets
    needs: [test, build-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag & Dutch Codename
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          # Dutch proper noun release codename (1 word)
          case "$TAG" in
            v0.1.0) CODENAME="Amsterdam" ;;
            v0.2.0) CODENAME="Rotterdam" ;;
            v0.3.0) CODENAME="Utrecht" ;;
            v0.3.1) CODENAME="Haarlem" ;;
            v0.4.0) CODENAME="Delft" ;;
            v0.4.1) CODENAME="Rembrandt" ;;
            v0.4.2) CODENAME="Vermeer" ;;
            v0.5.0) CODENAME="Spinoza" ;;
            v0.5.1) CODENAME="Leeuwenhoek" ;;
            v0.5.2) CODENAME="Huygens" ;;
            v0.6.0) CODENAME="Erasmus" ;;
            *)      CODENAME="Grotius" ;;
          esac
          echo "CODENAME=${CODENAME}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=v${TAG#v} — ${CODENAME}" >> $GITHUB_ENV

      - name: Download All Built Assets
        uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Generate Clean Release Notes
        shell: bash
        run: |
          # Identify previous tag for comparison
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^${RELEASE_TAG}$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v0.5.1"
          fi

          cat << 'EOF' > release_notes.md
          ## Release **${{ env.CODENAME }}** (${{ env.RELEASE_TAG }})

          ### Key Highlights in v0.5.2
          - **Query Planner Primary Key Pushdown**:
            - Fast-path pushdown of `WHERE id = <val>` directly into `PhysicalOperator::ScanVertices { id_filter: Some(vid) }`.
            - Added $O(1)$ point-lookup vertex existence checks (`has_vertex`) across StorageEngine, VertexPropertyTable, and DeltaMemTable.
            - Eliminates multi-hop wavefront BFS traversal timeouts and redundant full-graph scans (>5,000x speedup).
          - **GDB Studio Web UI & Startup Script Overhaul**:
            - Updated `scripts/start_studio.sh` with complete CLI flag parsing (`--port`, `--cluster-url`, `--host`, `--no-browser`) and legacy positional argument compatibility.
            - Resilient health check retry loop with automatic diagnosis and log dumping on failure.
          - **Unified Python Client (`gdb-client` on PyPI)**:
            - Client SDK unified into standalone `gdb-py-client` with zero-copy Polars, Arrow, Pandas, and NetworkX exports.
            - Parallel Arrow Flight scatter-ingest and REST batch APIs.
          - **Multi-Threaded Benchmark Pipeline**:
            - Multi-worker ingestion, configurable timeouts, and automatic CBO `ANALYZE GRAPH;` execution in `scripts/gpu_benchmark.py`.

          ### Checksums & Verification
          Every binary archive is accompanied by a SHA256 checksum file (`.tar.gz.sha256`).

          **Full Changelog**: https://github.com/1orgar/gdb/compare/${PREV_TAG}...${{ env.RELEASE_TAG }}
          EOF

          # Replace variable in release_notes.md
          sed -i "s/\${PREV_TAG}/$PREV_TAG/g" release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "GDB Release ${{ env.RELEASE_TITLE }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: all_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
