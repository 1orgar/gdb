[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-client"
version = "0.5.1"
description = "Official Python SDK & Arrow Flight Client for GDB (Distributed In-Memory Graph Database)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "GDB Development Team"}
]
keywords = ["graph-database", "cypher", "arrow-flight", "polars", "networkx", "distributed-database"]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
all = [
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
]
flight = [
    "pyarrow>=14.0.0",
]
analytics = [
    "polars>=0.20.0",
    "networkx>=3.0",
]
